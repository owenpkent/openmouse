# F-Droid metadata for OpenMouse.
#
# This is the file to submit to https://gitlab.com/fdroid/fdroiddata as
# metadata/io.github.owenpkent.openmouse.yml (via a merge request). F-Droid
# builds from source and signs with its own key, so the app's own signing is not
# used for the F-Droid build. The store listing text and screenshots are picked
# up automatically from fastlane/metadata/android/en-US in this repo.

Categories:
  - Accessibility
License: MIT
AuthorName: Owen Kent
AuthorEmail: Owenpkent@gmail.com
WebSite: https://github.com/owenpkent/openmouse
SourceCode: https://github.com/owenpkent/openmouse
IssueTracker: https://github.com/owenpkent/openmouse/issues
Changelog: https://github.com/owenpkent/openmouse/blob/HEAD/CHANGELOG.md

RepoType: git
Repo: https://github.com/owenpkent/openmouse.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    gradle:
      - yes

  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0
    subdir: app
    gradle:
      - yes
    # Compiles the in-app GitHub Releases update check out of the F-Droid build
    # (BuildConfig.UPDATER_ENABLED = false). F-Droid ships updates itself and
    # signs with its own key, so the check would be useless here, and leaving it
    # out keeps the build free of any network code. (The sideload APK checks
    # once per launch by default; this build never does.)
    gradleprops:
      - openmouseUpdater=false

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.2.0
CurrentVersionCode: 2
