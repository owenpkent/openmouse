# Static analysis of the Kotlin code, for GitHub code scanning and the OpenSSF
# Scorecard SAST check. Results appear under Security, Code scanning. Kotlin is
# analysed from a real build (build-mode manual), so the job assembles the debug
# APK the same way ci.yml does.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 3'  # Wednesdays 05:00 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - name: Build (traced by CodeQL)
        # A clean build with the build cache off: setup-gradle restores the cache
        # and gradle.properties enables it, so compileDebugKotlin could come back
        # FROM-CACHE and CodeQL would see no Kotlin compilation at all.
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
