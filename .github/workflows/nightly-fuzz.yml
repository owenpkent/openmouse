name: Nightly fuzz

# Runs the Jazzer fuzz targets under app/src/test/.../fuzz in fuzzing mode for
# their full @FuzzTest maxDuration (10 minutes each). Any finding fails the job;
# the reproducing input Jazzer writes next to the seed corpus is uploaded so it
# can be committed as a permanent regression test.
#
# Not a pull request check: fuzzing is open-ended by nature. GitHub stops a
# schedule after 60 days without a commit; a manual run restarts it. Actions are
# pinned to a commit (tag in the comment) and the checkout keeps no credentials.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

# A manual run should not cancel the night's, and the night's should not cancel
# a manual one.
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz pure cores (Jazzer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Fuzz
        env:
          JAZZER_FUZZ: "1"
        run: ./gradlew testDebugUnitTest --tests '*FuzzTest' --no-daemon

      - name: Upload findings and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-findings
          path: |
            app/src/test/resources/**/*FuzzTestInputs/
            app/crash-*
            app/timeout-*
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
