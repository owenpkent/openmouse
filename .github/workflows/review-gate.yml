# A pull request into main needs a review on its latest commit before it can merge. GitHub's own
# "required approvals" cannot do this here: every pull request is opened from the owner's account
# and the owner's reviewer posts from it too, and GitHub never counts an author's review as an
# approval. So this workflow reads the reviews itself and sets a commit status named `Reviewed` on
# the head commit, which branch protection requires.
#
# A status, not a check: every push and every review starts a run, and GitHub keeps each run's
# check, so a failed check from the push stayed on the commit after a later review passed, and
# branch protection went by the failure. A commit status has one current value per name, the one
# set last, so the newest run decides. The job itself succeeds whatever it decides, and fails only
# when it cannot read the reviews or write the status. Branch protection requires its check, `Set
# the Reviewed status`, as well: a write that failed would otherwise leave an earlier success in
# place (say a review was dismissed), and that failed check blocks merging until the run is re-run.
#
# `Reviewed` is success when at least one review (approve, comment, or request changes) with a
# summary was submitted on the head commit and none in the newest second of them requests changes.
# A review needs a summary to count because a reply to an inline comment is also stored as a
# review, with an empty body, and a reply is not a review. A push makes the commit new, with no
# status, so merging waits until that commit is reviewed. It is a process guard, not a security
# boundary: anyone who can post a review, or set a status, from the owner's account can satisfy it.
#
# pull_request_target, not pull_request, because setting a status needs a token that can write
# statuses. That is safe here only because nothing from the pull request is checked out or run:
# the workflow reads the event's numbers and the reviews API, and the script below is the base
# branch's copy. Keep it that way.
name: Review gate

on:
  pull_request_target:
    branches: [main]
    # `edited` covers a pull request retargeted to main.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  statuses: write

jobs:
  review-status:
    name: Set the Reviewed status
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set Reviewed from the reviews on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set_status() {
            echo "Reviewed: $1 ($2)"
            if ! gh api -X POST "repos/$REPO/statuses/$HEAD" -f state="$1" -f context=Reviewed \
              -f description="$2" -f target_url="$RUN_URL" > /dev/null; then
              # The write failed (a read-only token, as on a review of a pull request from a fork,
              # or an outage), so an earlier Reviewed=success may still stand. Fail the job: its
              # check is required too, and a failed check stays until this run is re-run, so
              # merging is blocked even then.
              echo "::error::Could not set the Reviewed status on $HEAD; an earlier value may still stand. Re-run this workflow once the status can be written."
              exit 1
            fi
          }
          # Read the reviews on their own, so a failed API call is reported as one and not as
          # "no review". Ordered by submission time, never by id: a pending review gets its id
          # when it is started, not when it is submitted. Submission times are whole seconds, so
          # a request for changes anywhere in the newest second counts as the newest review.
          if ! all=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.commit_id == env.HEAD) | select((.body // "") != "") | select(.state == "APPROVED" or .state == "COMMENTED" or .state == "CHANGES_REQUESTED") | "\(.submitted_at) \(.state) \(.user.login) \(.id)"'); then
            set_status error "Could not read the reviews from the GitHub API. Re-run this workflow."
            exit 1
          fi
          reviews=$(printf '%s\n' "$all" | sed '/^$/d' | LC_ALL=C sort)
          echo "Reviews on $HEAD:"
          echo "${reviews:-  none}"
          if [ -z "$reviews" ]; then
            set_status failure "No review on the latest commit yet."
            exit 0
          fi
          newest=$(printf '%s\n' "$reviews" | tail -n 1 | cut -d' ' -f1)
          if printf '%s\n' "$reviews" | awk -v t="$newest" '$1 == t && $2 == "CHANGES_REQUESTED" { found = 1 } END { exit !found }'; then
            set_status failure "The newest review on the latest commit requests changes."
            exit 0
          fi
          set_status success "Reviewed on the latest commit."
